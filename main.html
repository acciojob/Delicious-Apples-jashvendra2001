
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delicious Apples</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #c4e58a;
      font-family: Arial, sans-serif;
    }

    .product {
      display: flex;
      align-items: center;
      gap: 45px;
      width: 850px;
      max-width: 95%;
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
    }

    .product__photo {
      width: 45%;
    }

    .photo-container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }

    .photo-main {
      background: linear-gradient(135deg, #b5db42, #7eaf23);
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .photo-main > img {
      width: 90%;
      height: 280px;
      object-fit: contain;
    }

    .photo-album {
      padding: 15px;
    }

    .photo-album > ul {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .photo-album > ul > li {
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 5px;
    }

    .photo-album > ul > li > img {
      width: 55px;
      height: 55px;
      object-fit: contain;
    }

    .product__info {
      flex: 1;
    }

    .title h1 {
      font-size: 28px;
      color: #333;
      margin-bottom: 5px;
    }

    .title span {
      font-size: 13px;
      color: #aaa;
    }

    .price {
      margin: 30px 0;
      color: #e74c3c;
      font-size: 20px;
    }

    .price span {
      font-size: 48px;
    }

    .variant h3,
    .description h3 {
      font-size: 13px;
      color: #999;
      letter-spacing: 1px;
    }

    .variant ul {
      list-style: none;
      display: flex;
      gap: 12px;
      padding: 0;
    }

    .variant li {
      padding: 5px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }

    .variant img {
      width: 45px;
      height: 45px;
      object-fit: contain;
    }

    .description {
      margin-top: 30px;
    }

    .description ul {
      padding-left: 20px;
      line-height: 1.8;
      color: #444;
      font-size: 14px;
    }

    .add-to-cart {
      margin-top: 20px;
      padding: 16px 35px;
      background: #ff3f40;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 63, 64, 0.25);
    }

    .add-to-cart:hover {
      background: #e52d30;
    }

    @media (max-width: 700px) {
      .product {
        flex-direction: column;
        padding: 20px;
        margin: 20px 0;
      }

      .product__photo {
        width: 100%;
      }

      .product__info {
        width: 100%;
      }

      .photo-main {
        height: 260px;
      }
    }
  </style>
</head>

<body>
  <main class="product">

    <!-- Product Photo -->
    <div class="product__photo">
      <div class="photo-container">

        <!-- Main Photo -->
        <div class="photo-main">
          <img
            src="https://res.cloudinary.com/john-mantas/image/upload/v1537302064/codepen/delicious-apples/green-apple2.png"
            alt="Green Apple"
          >
        </div>

        <!-- Photo Album -->
        <div class="photo-album">
          <ul>
            <li>
              <img
                src="https://res.cloudinary.com/john-mantas/image/upload/v1537302064/codepen/delicious-apples/green-apple2.png"
                alt="Green apple view"
              >
            </li>
            <li>
              <img
                src="https://res.cloudinary.com/john-mantas/image/upload/v1537302752/codepen/delicious-apples/yellow-apple.png"
                alt="Yellow apple view"
              >
            </li>
            <li>
              <img
                src="https://res.cloudinary.com/john-mantas/image/upload/v1537302427/codepen/delicious-apples/orange-apple.png"
                alt="Orange apple view"
              >
            </li>
            <li>
              <img
                src="https://res.cloudinary.com/john-mantas/image/upload/v1537302285/codepen/delicious-apples/red-apple.png"
                alt="Red apple view"
              >
            </li>
          </ul>
        </div>

      </div>
    </div>

    <!-- Product Information -->
    <div class="product__info">

      <div class="title">
        <h1>Delicious Apples</h1>
        <span>COD: 45999</span>
      </div>

      <!-- Price -->
      <div class="price">
        R$ <span>7.93</span>
      </div>

      <!-- Apple Varieties -->
      <div class="variant">
        <h3>SELECT A COLOR</h3>
        <ul>
          <li>
            <img
              src="https://res.cloudinary.com/john-mantas/image/upload/v1537302064/codepen/delicious-apples/green-apple2.png"
              alt="Green Apple"
            >
          </li>
          <li>
            <img
              src="https://res.cloudinary.com/john-mantas/image/upload/v1537302752/codepen/delicious-apples/yellow-apple.png"
              alt="Yellow Apple"
            >
          </li>
          <li>
            <img
              src="https://res.cloudinary.com/john-mantas/image/upload/v1537302427/codepen/delicious-apples/orange-apple.png"
              alt="Orange Apple"
            >
          </li>
          <li>
            <img
              src="https://res.cloudinary.com/john-mantas/image/upload/v1537302285/codepen/delicious-apples/red-apple.png"
              alt="Red Apple"
            >
          </li>
        </ul>
      </div>

      <!-- Benefits -->
      <div class="description">
        <h3>BENEFITS</h3>
        <ul>
          <li>Apples are nutritious.</li>
          <li>Apples may support weight management.</li>
          <li>Apples are good for your heart.</li>
          <li>Apples contain fiber and antioxidants.</li>
        </ul>
      </div>

      <!-- Add to Cart -->
      <button class="add-to-cart" type="button">
        ADD TO CART
      </button>

    </div>
  </main>
</body>
</html>
